apiVersion: apps/v1
kind: Deployment
metadata:
  name: cartservice-ts
  labels:
    app: cartservice-ts
spec:
  selector:
    matchLabels:
      app: cartservice-ts
  template:
    metadata:
      labels:
        app: cartservice-ts
    spec:
      serviceAccountName: cartservice
      terminationGracePeriodSeconds: 5
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: server
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true
        image: cartservice-ts
        ports:
        - containerPort: 3000
        resources:
          requests:
            cpu: 200m
            memory: 64Mi
          limits:
            cpu: 300m
            memory: 128Mi
        readinessProbe:
          initialDelaySeconds: 15
          httpGet:
            path: /
            port: 3000
        livenessProbe:
          initialDelaySeconds: 15
          periodSeconds: 10
          httpGet:
            path: /
            port: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: cartservice-ts
  labels:
    app: cartservice-ts
spec:
  type: ClusterIP
  selector:
    app: cartservice-ts
  ports:
  - name: http
    port: 80
    targetPort: 3000
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cartservice
